<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap' rel='stylesheet'>
    <link rel="stylesheet" type="text/css" href="stylesheets/stylesheet.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="stylesheets/pygment_trac.css" media="screen" />
    <link rel="stylesheet" type="text/css" href="stylesheets/print.css" media="print" />
    <title>{{title}} - David Yoon</title>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <h1 class="site-title">David Yoon</h1>
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" data-tooltip="Toggle dark mode">
            <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </header>

      <main class="main-content">
        {{ content }}
      </main>

      <footer class="footer">
        <nav class="footer-nav">
          <a href="http://twitter.com/_daveyoon">Twitter</a>
          <a href="http://github.com/daveyoon">GitHub</a>
          <a href="http://www.linkedin.com/in/daveyoon/">LinkedIn</a>
          <a href="http://instagram.com/daveyoon">Instagram</a>
        </nav>
      </footer>
    </div>
    
  <!-- Theme Toggle Script -->
  <script>
    // Theme toggle functionality
    (function() {
      const themeToggle = document.getElementById('theme-toggle');
      const body = document.body;
      
      // Check for saved theme preference or default to light mode
      const currentTheme = localStorage.getItem('theme') || 'light';
      
      // Apply the saved theme
      if (currentTheme === 'dark') {
        body.classList.add('dark-mode');
        updateTooltipText();
      }
      
      // Update tooltip text based on current theme
      function updateTooltipText() {
        const isDark = body.classList.contains('dark-mode');
        themeToggle.setAttribute('data-tooltip', isDark ? 'Switch to light mode' : 'Switch to dark mode');
      }
      
      // Theme toggle event listener
      themeToggle.addEventListener('click', function() {
        body.classList.toggle('dark-mode');
        
        // Save the current theme
        const isDark = body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        
        // Update tooltip text
        updateTooltipText();
      });
      
      // Initialize tooltip text
      updateTooltipText();
    })();
  </script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5EEQ3TT6RM"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-5EEQ3TT6RM');
</script><!-- Google Analytics end -->
    
  </body>
</html>
